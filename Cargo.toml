[package]
name = "cront"
version = "0.1.0"
edition = "2024"

[dependencies]
strum = { version = "0.28.0", features = ["derive"] }
num_enum = "0.7.5"
ustr = "1.1.0"
chumsky = { version = "1.0.0-alpha.8", features = ["pratt"] }
cstree = { version = "0.13.0", features = ["derive"] }
serde_json = "1.0.149"
cc = "1.2.56"
clap = { version = "4.5.60", features = ["derive"] }

[dev-dependencies]
snapbox = { version = "1.0.0", features = ["path"] }
